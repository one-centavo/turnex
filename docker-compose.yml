services:
  turnex-web:
    container_name: turnex-web
    image: nginx:alpine
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 64M
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - turnex-storage-public:/var/www/html/storage/app/public:ro
    depends_on:
      - turnex-app
    networks:
      - turnex-network
      - proxy-network

  turnex-app:
    container_name: turnex-app
    build:
      context: .
      dockerfile: ./docker/config/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    env_file:
      - ./.env
    volumes:
      - turnex-storage-public:/var/www/html/storage/app/public
      - turnex-storage-app:/var/www/html/storage/app
      - turnex-storage-logs:/var/www/html/storage/logs
    depends_on:
      turnex-db:
        condition: service_healthy
    command: >
      sh -c "php artisan storage:link &&
             php artisan config:cache &&
             php artisan route:cache &&
             php artisan view:cache &&
             php-fpm"
    networks:
      - turnex-network

  turnex-db:
    container_name: turnex-db
    image: mysql:8.4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 512M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-turnex_db}
      MYSQL_USER: ${DB_USERNAME:-turnex_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - turnex-db-data:/var/lib/mysql
    networks:
      - turnex-network

volumes:
  turnex-db-data:
  turnex-storage-public:
  turnex-storage-app:
  turnex-storage-logs:

networks:
  turnex-network:
    driver: bridge
  proxy-network:
    external: true